services:
  backend:
    image: ghcr.io/justaksi7/flowlens-backend:0.1.0

    restart: unless-stopped

    expose:
      - "8080"

  frontend:
    image: ghcr.io/justaksi7/flowlens-frontend:0.1.0

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_healthy